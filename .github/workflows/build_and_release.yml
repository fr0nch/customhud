name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - LICENSE
      - README.md
      - README_ru.md
  pull_request:
    paths-ignore:
      - LICENSE
      - README.md
      - README_ru.md

env:
  PROJECT_NAME: customhud
  SCRIPT: customhud.mjs
  MANIFEST: customhud.pplugin

jobs:
  setup:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      github_sha_short: ${{ steps.vars.outputs.github_sha_short }}
    steps:
      - name: Set variables
        id: vars
        run: echo "github_sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Generate Release
        if: ${{ !env.ACT }}
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build:
    needs: setup
    if: ${{ needs.setup.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare artifacts
        shell: bash
        run: |
          # The version in the manifest is set by release-please in the release PR
          mkdir -p build
          cp ${{ env.MANIFEST }} ${{ env.SCRIPT }} build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PROJECT_NAME }}-build-noarch-${{ needs.setup.outputs.github_sha_short }}
          path: build/
          retention-days: 7

  package:
    needs: ["setup", "build"]
    if: ${{ needs.setup.outputs.release_created }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      PLATFORM: noarch
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            conda
          sparse-checkout-cone-mode: false

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-build-${{ env.PLATFORM }}-${{ needs.setup.outputs.github_sha_short }}
          path: conda/

      - name: Prepare recipe
        shell: bash
        run: |
          # Pass version to recipe.yaml
          version="${{ needs.setup.outputs.tag_name }}"
          version="${version#v}"  # Remove leading 'v'
          echo "PACKAGE_VERSION=$version" >> $GITHUB_ENV

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: v0.76.1
          recipe-path: conda/recipe.yaml
          upload-artifact: false
          build-args: --output-dir conda-bld --test skip --package-format tar-bz2 --no-include-recipe

      - name: Prepare channel directory
        shell: bash -el {0}
        run: |
          # Create repo directory
          mkdir -p "build/package/${{ env.PLATFORM }}"

          # Copy package files (.tar.bz2 or .conda)
          find conda-bld -type f \( -name "*.tar.bz2" -o -name "*.conda" \) -exec cp {} "build/package/${{ env.PLATFORM }}/" \;

      - name: Upload conda package artifact
        uses: actions/upload-artifact@v6
        with:
          name: conda-package-${{ env.PLATFORM }}-${{ needs.setup.outputs.github_sha_short }}
          path: build/package/${{ env.PLATFORM }}/
          retention-days: 7

      - name: Package plugin archive
        shell: bash
        run: |
          mkdir -p "dist/${{ env.PROJECT_NAME }}"
          cp conda/${{ env.MANIFEST }} conda/${{ env.SCRIPT }} "dist/${{ env.PROJECT_NAME }}/"
          (cd dist && zip -r "${{ env.PROJECT_NAME }}-${{ needs.setup.outputs.tag_name }}.zip" "${{ env.PROJECT_NAME }}")

      - name: Upload release asset
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        id: release
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          files: |
            build/package/${{ env.PLATFORM }}/*.tar.bz2
            build/package/${{ env.PLATFORM }}/*.conda
            dist/${{ env.PROJECT_NAME }}-${{ needs.setup.outputs.tag_name }}.zip

  repository:
    needs: ["setup", "build", "package"]
    if: ${{ needs.setup.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/pages
            /*.pplugin
            /*.pmodule
            /*.pplugin.in
            /*.pmodule.in
          sparse-checkout-cone-mode: false
          path: source

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest

      - name: Install build tools
        shell: bash -el {0}
        run: |
          conda install conda python

      - name: Install conda-index
        shell: bash -el {0}
        run: |
          python -m pip install conda-index

      - name: Download aria2
        if: ${{ !env.ACT && vars.DOWNLOAD_PACKAGES == 'true' }}
        shell: bash -el {0}
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Download packages from all releases
        if: ${{ !env.ACT && vars.DOWNLOAD_PACKAGES == 'true' }}
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/repo/{linux-64,win-64,noarch}
          gh api /repos/${{ github.repository }}/releases?per_page=10 \
          | jq -r '.[] | .assets[] | .browser_download_url' \
          | grep -E "(\.tar\.bz2|\.conda)$" > urls.txt
      
          # separate by platform
          grep -E "linux[-_]64" urls.txt > linux.txt || true
          grep -E "win[-_]64" urls.txt > win.txt || true
          grep -E "osx[-_]arm64" urls.txt > osx.txt || true
          grep -v -E "(linux|win)[-_]64|osx[-_]arm64" urls.txt > noarch.txt || true
      
          if [ -s linux.txt ]; then aria2c -x4 -s4 -j4 -i linux.txt -d build/repo/linux-64/ --continue; fi
          if [ -s win.txt ]; then aria2c -x4 -s4 -j4 -i win.txt -d build/repo/win-64/ --continue; fi
          if [ -s osx.txt ]; then mkdir -p build/repo/osx-arm64; aria2c -x4 -s4 -j4 -i osx.txt -d build/repo/osx-arm64/ --continue; fi
          if [ -s noarch.txt ]; then aria2c -x4 -s4 -j4 -i noarch.txt -d build/repo/noarch/ --continue; fi

      - name: Download conda packages
        uses: actions/download-artifact@v7
        with:
          pattern: conda-package-*
          path: artifacts/
          merge-multiple: false

      - name: Organize conda packages
        shell: bash -el {0}
        run: |
          # download-artifact puts a single artifact directly into artifacts/, so sort by file name
          mkdir -p build/repo/noarch
          find artifacts -type f \( -name "*.tar.bz2" -o -name "*.conda" \) | while read -r file; do
            case "$(basename "$file")" in
              *linux[-_]64*) platform=linux-64 ;;
              *win[-_]64*) platform=win-64 ;;
              *osx[-_]arm64*) platform=osx-arm64 ;;
              *) platform=noarch ;;
            esac
            mkdir -p "build/repo/$platform"
            mv "$file" "build/repo/$platform/"
          done

      - name: Generate repodata
        shell: bash -el {0}
        run: |
          python -m conda_index build/repo

      - name: Create channel index.html
        shell: bash -el {0}
        env:
          PROJECT: ${{ env.PROJECT_NAME }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TAG: ${{ needs.setup.outputs.tag_name }}
          SHA: ${{ needs.setup.outputs.github_sha_short }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - <<'EOF'
          import glob, html, json, os, re

          manifests = glob.glob("source/*.pplugin") + glob.glob("source/*.pmodule")
          if not manifests:
              manifests = glob.glob("source/*.pplugin.in") + glob.glob("source/*.pmodule.in")
          if len(manifests) != 1:
              raise SystemExit(f"expected one manifest (*.pplugin, *.pmodule or *.in template) in the repository root, found {manifests}")

          path = manifests[0]
          kind = "module" if path.removesuffix(".in").endswith(".pmodule") else "plugin"
          text = open(path).read()

          def field(name):
              match = re.search(rf'"{name}"\s*:\s*"((?:[^"\\]|\\.)*)"', text)
              return json.loads(f'"{match.group(1)}"') if match else ""

          platforms = [p for p in ("linux-64", "win-64", "osx-arm64")
                       if glob.glob(f"build/repo/{p}/*.tar.bz2") + glob.glob(f"build/repo/{p}/*.conda")]

          values = {
              "PLATFORMS": " ".join(platforms),
              "KIND": kind,
              "KIND_NAME": "language module" if kind == "module" else "plugin",
              "KIND_LABEL": "Language module" if kind == "module" else "Plugin",
              "PROJECT": os.environ["PROJECT"],
              "REPOSITORY": os.environ["REPOSITORY"],
              "CHANNEL": os.environ["CHANNEL"],
              "TAG": os.environ["TAG"],
              "SHA": os.environ["SHA"],
              "DATE": os.environ["DATE"],
              "DESCRIPTION": field("description"),
              "LANGUAGE": field("language"),
              "AUTHOR": field("author"),
              "LICENSE": field("license"),
          }

          page = open("source/.github/pages/index.html").read()
          for key, value in values.items():
              page = page.replace(f"__{key}__", html.escape(value))

          open("build/repo/index.html", "w").write(page)
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/repo

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5
